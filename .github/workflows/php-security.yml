name: PHP security checks

on:
  push:
    branches: [main, security/foundation-hardening]
  pull_request:
    branches: [main]

jobs:
  php-lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, fileinfo
      - name: Lint every PHP file (including legacy tree)
        run: |
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
      - name: Run security helper tests
        run: php tests/run.php
